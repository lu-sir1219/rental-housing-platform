<h2 style="margin:0 0 16px;color:#dc2626;font-size:20px;">【签署提醒】您的合同签署即将截止</h2>

<p style="margin:0 0 12px;color:#475569;font-size:15px;line-height:1.7;">
您好，{tenant_name}：
</p>

<p style="margin:0 0 12px;color:#475569;font-size:15px;line-height:1.7;">
您的租房合同尚未完成签署。请在签署截止时间前完成签署，否则订单将被取消，预订押金将按规则处理。
</p>

<!-- Detail Card -->
<table width="100%" cellpadding="0" cellspacing="0" style="background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:20px;margin-bottom:24px;">
<tr><td style="padding:8px 0;">
<p style="margin:0 0 8px;color:#991b1b;font-size:14px;"><strong>订单编号：</strong>{order_number}</p>
<p style="margin:0 0 8px;color:#991b1b;font-size:14px;"><strong>房源名称：</strong>{property_name}</p>
<p style="margin:0 0 8px;color:#991b1b;font-size:14px;"><strong>合同编号：</strong>{contract_number}</p>
<p style="margin:0 0 8px;color:#991b1b;font-size:14px;"><strong>签署截止时间：</strong>{deadline}</p>
<p style="margin:0;color:#991b1b;font-size:14px;"><strong>剩余时间：</strong>约12小时</p>
</td></tr>
</table>

<!-- CTA Button -->
<table cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
<tr>
<td style="background:#dc2626;border-radius:8px;text-align:center;">
<a href="{order_url}" style="display:inline-block;padding:12px 32px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">立即签署合同</a>
</td>
</tr>
</table>

<p style="margin:0 0 12px;color:#f59e0b;font-size:14px;line-height:1.7;">
逾期未签署的订单将被取消，已支付的预订押金将不予退还。如已签署但页面未更新，请刷新或联系客服。
</p>

<p style="margin:0;color:#94a3b8;font-size:13px;">
此邮件由系统自动发送，请勿直接回复。
</p>
